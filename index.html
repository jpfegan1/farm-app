@font-face{font-family:Nunito;font-style:normal;font-weight:200 1000;font-display:swap;src:url(vendor/fonts/nunito-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
 --grass:#3cb371;--g:#23804a;--gd:#1c6b3d;--g2:#dcf5e5;--sky:#5ec8f0;--skyl:#dff6ff;--skyd:#0369a1;
 --sun:#ffd54a;--sund:#e6b800;--barn:#d9473a;--cream:#fff8e7;--soil:#3f2f22;
 --bg:#fff8e7;--card:#fff;--tx:#3f2f22;--mut:#5f6b60;--bd:#e3efe4;--red:#c8372b;--amb:#ef8f00;--blue:#0369a1;--r:22px;
 --lift:0 6px 0 #d4e8d0,0 10px 24px #0000000f}
*{box-sizing:border-box}
html,body{margin:0;color:var(--tx);font:500 16px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{background:linear-gradient(180deg,var(--skyl) 0%,#e8f7e4 45%,var(--cream) 100%) fixed var(--cream)}

.banner{background:#fff6cc;border:2px dashed var(--sund);padding:12px 14px;border-radius:18px;margin-bottom:14px;font-size:14px;font-weight:700;color:#6b4f00}
.card{background:var(--card);border:2px solid #e8f3ea;border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--lift)}
.card h2,.card h3{margin:0 0 12px;font-size:18px;font-weight:800;color:var(--soil)}
.card h2{font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.grid .card{margin:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{background:#fff;border:2px solid #e3f0e4;border-radius:var(--r);padding:14px;box-shadow:0 6px 0 #d4e8d0,0 8px 20px #0000000f;position:relative;overflow:hidden}
.kpi .ico{font-size:28px;line-height:1;margin-bottom:4px}

.kpi span{font-size:13px;color:var(--mut);font-weight:700}
.kpi.sky{border-color:#b3e5fc;box-shadow:0 6px 0 #d6f0fb,0 8px 20px #0000000f}.kpi.sky b{color:var(--skyd)}
.kpi.warn{border-color:#ffb4a8;background:#fff;box-shadow:0 6px 0 #ffd5ce,0 8px 20px #0000000f}.kpi.warn b{color:var(--red)}

button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e6d9b8}
button.pri,.btn.pri{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}
button.pri:active,.btn.pri:active{box-shadow:0 1px 0 var(--gd)}
button.danger{background:#fff0ee;color:var(--red);border-color:#ffc9c1;box-shadow:0 4px 0 #ffd5ce}
button.sm,.btn.sm{min-height:38px;padding:5px 12px;font-size:14px;border-radius:13px;box-shadow:0 3px 0 #e6d9b8}
button.pri.sm,.btn.pri.sm{box-shadow:0 3px 0 var(--gd)}
button.on{background:#fff;border-color:var(--sun);color:var(--gd);box-shadow:0 3px 0 #e6b80066}
button:disabled{opacity:.5;transform:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.row .sp{flex:1}
.mut{color:var(--mut);font-size:14px;font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 7px;border-bottom:2px dashed #eef3ee;vertical-align:top}

th:first-child{border-radius:12px 0 0 12px}th:last-child{border-radius:0 12px 12px 0}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover,tr.click:active{background:#fffbe9}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#f1ede2;color:var(--soil);white-space:nowrap}
.pill.red{background:#ffe0db;color:#b3261b}.pill.amb{background:#fff1c2;color:#8a5f00}.pill.grn{background:#d8f5e3;color:var(--gd)}.pill.blue{background:#dff3fd;color:var(--skyd)}

input,select,textarea{font:inherit;font-weight:600;font-size:16px;width:100%;min-height:46px;padding:9px 12px;border:2px solid #dfe9e0;border-radius:14px;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--grass);outline:0;box-shadow:0 0 0 4px #3cb37133}
input[type=checkbox]{width:26px;height:26px;min-height:0;accent-color:var(--grass)}

textarea{min-height:80px}
label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--mut);font-weight:700}
label.f>span{display:block;margin-bottom:4px}
label.cb{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:44px;font-weight:700}
.hint{font-size:12.5px;color:var(--mut);margin-top:3px;font-weight:600}
.hint.warn{color:#8a5f00}
dialog{border:3px solid #fff;border-radius:26px;padding:0;width:min(560px,96vw);max-height:92vh;box-shadow:0 8px 0 #d4e8d0,0 16px 48px #0005;background:#fff;color:var(--tx)}
dialog::backdrop{background:#1c3a2a8c}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

#map{width:100%;height:auto;max-height:70vh;display:block;touch-action:none;user-select:none}

.maphelp{position:absolute;left:8px;top:8px;right:8px;background:#fffdf3f2;border:2px solid var(--sun);border-radius:16px;padding:8px 12px;font-size:14px;font-weight:700;pointer-events:none;box-shadow:0 3px 0 #e6b80055}
#lmap{width:100%;height:62vh;min-height:320px;max-height:760px;background:#cfd8cc;z-index:0}
#lmap.drawing{cursor:crosshair}

.areabox{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:500;background:var(--sun);color:#3f2f22;font-weight:900;padding:8px 16px;border-radius:999px;font-size:17px;white-space:nowrap;pointer-events:none;border:3px solid #fff;box-shadow:0 4px 0 var(--sund),0 6px 16px #0004}

.farmpin{font-size:26px;line-height:28px;text-align:center;filter:drop-shadow(0 2px 2px #000a)}
.leaflet-bar{border:0!important;border-radius:14px!important;overflow:hidden;box-shadow:0 3px 0 #0002,0 4px 12px #0003!important}
.leaflet-touch .leaflet-bar a{width:42px;height:42px;line-height:42px;color:var(--soil)}
.leaflet-control-layers{border-radius:14px!important;border:0!important;box-shadow:0 3px 0 #0002,0 4px 12px #0003!important;font:700 14px Nunito,system-ui,sans-serif}
.leaflet-container{font-family:Nunito,system-ui,sans-serif}
.leaflet-container a.btn{color:inherit}
.leaflet-popup-content-wrapper{border-radius:16px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;font-weight:700;margin-top:10px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:6px;vertical-align:-3px;margin-right:4px;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
canvas.chart{width:100%;display:block;background:linear-gradient(180deg,#eefaf2,#fff);border:2px solid #d8f0e0;border-radius:16px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gallery figure{margin:0;background:#fff;border:3px solid #fff;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 5px 0 #d4e8d0,0 6px 14px #0001}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:14px 14px 0 0}

.wx{display:grid;grid-template-columns:repeat(7,minmax(74px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.wx div{background:linear-gradient(180deg,var(--skyl),#fff);border:2px solid #c8ebf8;border-radius:18px;padding:9px 6px;text-align:center;font-size:13px;font-weight:700}

.wxcmp td,.wxcmp th{text-align:center;white-space:nowrap}
.wxcmp td:first-child,.wxcmp th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}

.subtabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding:2px 2px 6px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;border-radius:999px}
.empty{padding:22px 14px;text-align:center;color:var(--mut);font-weight:700;background:#fffdf3;border:2px dashed #f0dfa8;border-radius:18px}
.empty .emo{display:block;font-size:40px;line-height:1.1;margin-bottom:6px}
.credits{margin:0;padding-left:18px;font-size:12.5px;line-height:1.45;color:var(--mut);font-weight:600}.credits li{margin-bottom:5px}.credits b{color:var(--tx)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--soil);color:#fff;padding:12px 20px;border-radius:999px;z-index:100;font-size:15px;font-weight:800;max-width:92vw;border:3px solid var(--sun);box-shadow:0 6px 20px #0004}
#printArea{display:none}
#auth{max-width:440px;margin:26px auto;padding:0 14px}
.authcard{padding:24px;border-width:3px;position:relative;overflow:hidden}
.authcard h2{color:var(--gd)}
.authcard hr{border:0!important;border-top:2px dashed #eee3c6!important}
body.loggedout nav{display:none}
body.loggedout header{padding-bottom:8px}
body.loggedout main{display:none}
@media(max-width:480px){main{padding:12px 10px 90px}.card{padding:14px}header h1{font-size:18px}}
@media print{
 header,main,dialog,.toast{display:none!important}
 #printArea{display:block}
 #printArea table{font-size:11px}
 #printArea th,#printArea td{border:1px solid #999;padding:3px 4px}
 body{background:#fff}
 body::before{display:none}
}
body.loggedout header .gear{display:none}
/* v4: header gear, quiet sync badge, nav More, farm types, tabs, crops */
header .gear{flex:0 0 auto;margin-left:auto;width:48px;height:48px;margin-right:-4px;border-radius:16px;display:grid;place-items:center;color:#fff;background:#ffffff2e;border:2px solid transparent;text-decoration:none;transition:transform .15s}
header .gear:hover{background:#ffffff45}header .gear:active{transform:scale(.94)}

.achoice:has(input:focus-visible){outline:3px solid var(--sun)}

 <div class="top"><a class="brand" href="#dash" aria-label="Farmhand — home"><img src="favicon.svg" alt=""><span class="wm"><b>FARMHAND</b><i></i></span></a><h1 id="farmTitle"></h1><span class="net" id="net" role="status" aria-live="polite"></span><a class="gear" id="gear" href="#settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path fill="currentColor" d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.48.48 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54a7.37 7.37 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58a7.6 7.6 0 0 0 0 1.88l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></a></div>

<script>
'use strict';
/* =========================================================
   Farmhand (formerly Farm App) v1 — single-file farm records (record-keeping aid)
   Data model: every record has id, createdAt, updatedAt,
   source ('manual' now; 'sensor' reserved for future feeds),
   and optional demo:true for demo records.
   ========================================================= */
const APP_VERSION = 4;
const SB_URL = 'https://uetglzwzyhvaoszainmx.supabase.co';
const SB_KEY = 'sb_publishable__gDnjBirb1AbnZwMAXMTxg_alW8T4_h'; // publishable key: safe in the browser, data protected by row-level security
const APP_URL = location.origin + location.pathname.replace(/index\.html$/,'');
let sb=null, UID=null, USER=null;
const kData = () => `farmapp.v2.${UID}.data`, kQueue = () => `farmapp.v2.${UID}.queue`, kWx = () => `farmapp.v2.${UID}.weather`;
const COLLECTIONS = ['paddocks','grazings','grassWalks','cows','milk','breeding','tasks','treatments','fertiliser','movements','deaths','photos','groups','stockEvents','plantings','cropOps','customCrops'];
const DEFAULT_SETTINGS = {farmName:'', herdNumber:'', lat:53.43, lon:-7.94, kgDmPerCow:17, demandCows:null,
  residual:50, growthSource:'auto', manualGrowth:30, mPerUnit:1, mapW:1000, mapH:700,
  farmTypes:['dairy'], approach:'conventional', tabPrefs:null, pigHerdNo:''}; // existing accounts default to Dairy + Conventional

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => (v==null?'':String(v)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const nowISO = () => new Date().toISOString();
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDays(s, n){ if(!s) return null; const t=Date.parse(s+'T00:00:00Z'); if(isNaN(t)) return null; return new Date(t+Math.round(n*864e5)).toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5); }
function fmtD(s){ if(!s) return ''; const [y,m,d]=s.slice(0,10).split('-'); return `${d}/${m}/${y}`; }
const num = (v, dp=0) => (v==null||v===''||isNaN(v)) ? '–' : Number(v).toLocaleString('en-IE',{maximumFractionDigits:dp, minimumFractionDigits:dp});
const sum = a => a.reduce((x,y)=>x+(Number(y)||0),0);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const byDate = (k='date', dir=-1) => (a,b) => (a[k]||'') < (b[k]||'') ? -dir : (a[k]||'') > (b[k]||'') ? dir : 0;

/* ---------- store (cloud: Supabase, with per-user local cache + offline queue) ---------- */
let S, Q={};            // S = state, Q = pending sync ops keyed by record id ('up' | 'del' | 'rmfile')
let lastSettingsJSON=null;
function blankState(){ const s={app:'farm-app', version:APP_VERSION, createdAt:nowISO(), settings:{...DEFAULT_SETTINGS}}; COLLECTIONS.forEach(c=>s[c]=[]); return s; }
function normalize(s){
  if(!s || typeof s!=='object') s=blankState();
  s.settings={...DEFAULT_SETTINGS, ...(s.settings||{})};
  COLLECTIONS.forEach(c=>{ if(!Array.isArray(s[c])) s[c]=[]; });
  return s;
}
function loadCache(){ let s=null; try{ s=JSON.parse(localStorage.getItem(kData())); }catch(e){} return normalize(s); }
function loadQueue(){ try{ return JSON.parse(localStorage.getItem(kQueue()))||{}; }catch(e){ return {}; } }
function saveLocal(){ if(!UID) return; try{ localStorage.setItem(kData(), JSON.stringify(S)); localStorage.setItem(kQueue(), JSON.stringify(Q)); }catch(e){ alert('Could not save on this device — storage may be full. '+e.message); } }
function enqueue(id, op){ Q[id]={op, t:Date.now()}; }
function save(){ if(!UID) return; if(JSON.stringify(S.settings)!==lastSettingsJSON) enqueue('__settings','up'); saveLocal(); setSync(); scheduleFlush(); }
function add(col, obj, silent){ const t=nowISO(); const r={id:uid(), createdAt:t, updatedAt:t, source:'manual', ...obj}; S[col].push(r); enqueue(r.id,'up'); if(!silent) save(); return r; }
function upd(col, id, patch){ const r=get(col,id); if(r){ Object.assign(r, patch, {updatedAt:nowISO()}); enqueue(id,'up'); save(); } return r; }
function del(col, id){ const r=get(col,id); if(col==='photos' && r && r.path){ enqueue('file:'+r.path,'rmfile'); idbDel('pending',id).catch(()=>{}); }
  S[col]=S[col].filter(x=>x.id!==id); enqueue(id,'del'); save(); }
function get(col, id){ return S[col].find(r=>r.id===id); }
S = blankState();

/* ---------- sync engine ---------- */
let flushing=false, flushTimer=null, lastSyncAt=0, lastSyncErr='', pulling=false;
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
function scheduleFlush(ms=700){ clearTimeout(flushTimer); flushTimer=setTimeout(flush, ms); }
async function pendingCount(){ if(!UID) return 0; try{ return (await idbAll('pending')).filter(p=>p.uid===UID).length; }catch(e){ return 0; } }
async function flush(){
  if(!UID || !sb || flushing) return; if(!navigator.onLine){ setSync(); return; }
  const uidNow=UID; const snap={...Q}; const ids=Object.keys(snap);
  if(!ids.length && !(await pendingCount())){ setSync(); return; }
  flushing=true; setSync();
  try{
    const idx=new Map(); COLLECTIONS.forEach(c=>S[c].forEach(r=>idx.set(r.id,[c,r])));
    const ups=[], dels=[], files=[]; let settings=false;
    for(const [id,e] of Object.entries(snap)){
      if(id==='__settings'){ settings=true; continue; }
      if(e.op==='rmfile'){ files.push(id.slice(5)); continue; }
      const hit=idx.get(id); if(e.op==='up' && hit) ups.push({user_id:uidNow, id, collection:hit[0], data:hit[1]}); else dels.push(id);
    }
    for(const c of chunk(ups,400)){ const {error}=await sb.from('records').upsert(c,{onConflict:'user_id,id'}); if(error) throw error; }
    for(const c of chunk(dels,200)){ const {error}=await sb.from('records').delete().in('id',c); if(error) throw error; }
    if(settings){ const sj=JSON.stringify(S.settings); const {error}=await sb.from('user_settings').upsert({user_id:uidNow, data:S.settings}); if(error) throw error; lastSettingsJSON=sj; }
    for(const c of chunk(files,100)){ const {error}=await sb.storage.from('photos').remove(c); if(error) throw error; }
    if(UID!==uidNow) return;
    for(const [id,e] of Object.entries(snap)) if(Q[id]===e) delete Q[id];
    saveLocal();
    await uploadPending();
    lastSyncAt=Date.now(); lastSyncErr='';
  }catch(e){ console.warn('Sync failed', e); lastSyncErr=e.message||String(e); scheduleFlush(15000); }
  finally{ flushing=false; setSync(); if(UID && Object.keys(Q).length && !lastSyncErr) scheduleFlush(300); }
}
async function pull(){
  if(!UID || !sb || !navigator.onLine || pulling) return false; const uidNow=UID; pulling=true; setSync();
  try{
    const rows=[]; for(let from=0;;from+=1000){ const {data,error}=await sb.from('records').select('id,collection,data').order('id').range(from,from+999); if(error) throw error; rows.push(...data); if(data.length<1000) break; }
    const {data:st,error:e2}=await sb.from('user_settings').select('data').maybeSingle(); if(e2) throw e2;
    if(UID!==uidNow) return false;
    const fresh=blankState(); fresh.createdAt=S.createdAt; rows.forEach(r=>{ if(fresh[r.collection]) fresh[r.collection].push(r.data); });
    if(st && st.data) fresh.settings={...DEFAULT_SETTINGS, ...st.data};
    const local=new Map(); COLLECTIONS.forEach(c=>S[c].forEach(r=>local.set(r.id,[c,r])));
    for(const [id,e] of Object.entries(Q)){            // unsynced local changes win
      if(id==='__settings'){ fresh.settings=S.settings; continue; } if(e.op==='rmfile') continue;
      const l=local.get(id); const cols=l?[l[0]]:COLLECTIONS; cols.forEach(c=>fresh[c]=fresh[c].filter(r=>r.id!==id));
      if(e.op==='up' && l) fresh[l[0]].push(l[1]); }
    S=normalize(fresh); if(!Q.__settings) lastSettingsJSON=JSON.stringify(S.settings);
    saveLocal(); lastSyncAt=Date.now(); lastSyncErr=''; return true;
  }catch(e){ console.warn('Pull failed', e); lastSyncErr=e.message||String(e); return false; }
  finally{ pulling=false; setSync(); }
}
function syncDetail(){ const n=Object.keys(Q).length; if(!navigator.onLine) return `offline${n?` · ${n} change${n>1?'s':''} waiting`:''}`; if(flushing||pulling) return 'syncing…'; if(lastSyncErr) return 'sync problem — will retry'; if(n) return `${n} change${n>1?'s':''} pending`; return lastSyncAt?'up to date':''; }
/* header indicator: silent when all is well; only shows for offline-with-unsynced-changes or a sync error */
function syncText(){ const n=Object.keys(Q).length; if(!navigator.onLine) return n?`⚠ offline · ${n} unsynced`:''; if(lastSyncErr) return '⚠ sync problem'; return ''; }
function setSync(){ const t=syncText(); const el=$('#net'); if(el){ el.textContent=UID?t:''; el.title=UID&&t?syncDetail()+(lastSyncErr?' — '+lastSyncErr:''):''; } const si=$('#syncInfo'); if(si) si.textContent=syncDetail()+(lastSyncAt?` (last sync ${new Date(lastSyncAt).toLocaleTimeString('en-IE',{timeZone:'Europe/Dublin',hour:'2-digit',minute:'2-digit'})})`:'')+(lastSyncErr?` — ${lastSyncErr}`:''); }

/* ---------- lookups ---------- */
const COW_STATUS = ['milking','dry','heifer','calf','bull','sold','died'];
const PAD_STATUS = {grazing:{l:'Grazing now',c:'#1e6fd0'}, resting:{l:'Resting',c:'#5fae5f'}, silage:{l:'Silage',c:'#e6c619'}, reseeding:{l:'Reseeding',c:'#8d6e63'}};
const BREEDS = ['Holstein Friesian','Friesian','Jersey','Jersey cross','Norwegian Red','Montbéliarde','Kiwi cross','Shorthorn','Angus','Hereford','Limousin','Charolais','Simmental','Belgian Blue','Saler','Other'];
const cowLabel = c => c ? (c.tag||c.name ? `${c.tag||''}${c.tag&&c.name?' · ':''}${c.name||''}` : '(no tag)') : '—';
const cowName = id => { const c=get('cows',id); return c?cowLabel(c):''; };
const padName = id => { const p=get('paddocks',id); return p?p.name:''; };
const activeCows = () => S.cows.filter(c=>(!c.species||c.species==='cattle')&&!['sold','died'].includes(c.status)); // cattle only; other species use the same records with a species field
const cowOpts = (all, sp='cattle') => [['','—']].concat(S.cows.filter(c=>(sp==='any'||(sp==='cattle'?(!c.species||c.species==='cattle'):c.species===sp))&&(all||!['sold','died'].includes(c.status))).slice().sort((a,b)=>(a.tag||'').localeCompare(b.tag||'')).map(c=>[c.id, (sp==='any'&&c.species&&c.species!=='cattle'?(SP_ICON[c.species]||'')+' ':'')+cowLabel(c)]));
const padOpts = () => [['','—']].concat(S.paddocks.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[p.id,p.name]));
const IE_TAG = /^IE\s?\d{6}\s?\d\s?\d{4,5}$/i;
function normTag(t){ return (t||'').trim().toUpperCase().replace(/\s+/g,' '); }

/* ---------- generic form dialog ----------
   field: {k,l,t:'text|number|date|select|textarea|checkbox|file|datalist|time',o:options|fn,req,ph,hint,full,show:(vals)=>bool,step,min,max,validate:(v,vals)=>warning}
*/
function openForm({title, fields, values={}, onSave, onDelete, saveLabel='Save', extraHTML=''}){
  const dlg=$('#dlg');
  const fh = f => {
    const v = values[f.k] ?? (typeof f.def==='function'?f.def():f.def) ?? '';
    const id='f_'+f.k; const req=f.req?' required':''; const ph=f.ph?` placeholder="${esc(f.ph)}"`:'';
    let inp;
    if(f.t==='select'){ const opts=typeof f.o==='function'?f.o():f.o; inp=`<select id="${id}" name="${f.k}"${req}>${opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(ov)}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`;}).join('')}</select>`; }
    else if(f.t==='textarea') inp=`<textarea id="${id}" name="${f.k}"${ph}>${esc(v)}</textarea>`;
    else if(f.t==='checkbox') return `<label class="cb ${f.full!==false?'full':''}" data-wrap="${f.k}"><input type="checkbox" id="${id}" name="${f.k}"${v?' checked':''}> ${esc(f.l)}</label>`;
    else if(f.t==='file') inp=`<input type="file" id="${id}" name="${f.k}" accept="${f.accept||'image/*'}"${f.multiple?' multiple':''}${req}>`;
    else if(f.t==='datalist'){ const opts=typeof f.o==='function'?f.o():f.o; inp=`<input id="${id}" name="${f.k}" list="${id}_dl" value="${esc(v)}"${ph}${req} autocomplete="off"><datalist id="${id}_dl">${opts.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`; }
    else inp=`<input type="${f.t||'text'}" id="${id}" name="${f.k}" value="${esc(v)}"${ph}${req}${f.step?` step="${f.step}"`:(f.t==='number'?' step="any"':'')}${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}${f.t==='number'?' inputmode="decimal"':''}>`;
    return `<label class="f ${f.full?'full':''}" data-wrap="${f.k}"><span>${esc(f.l)}${f.req?' *':''}</span>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}<div class="hint warn" data-warn="${f.k}"></div></label>`;
  };
  dlg.innerHTML = `<form method="dialog" id="dlgForm" novalidate>
    <div class="dh"><h3>${esc(title)}</h3><button type="button" class="sm" data-x>✕</button></div>
    <div class="db">${extraHTML}<div class="fgrid">${fields.map(fh).join('')}</div><div class="hint warn" id="formErr"></div></div>
    <div class="df">${onDelete?'<button type="button" class="danger" data-del>Delete</button>':''}<span class="sp"></span><button type="button" data-x>Cancel</button><button type="submit" class="pri">${esc(saveLabel)}</button></div></form>`;
  const form=$('#dlgForm');
  const gather = () => { const o={}; fields.forEach(f=>{ const el=form.elements[f.k]; if(!el) return;
      if(f.t==='checkbox') o[f.k]=el.checked;
      else if(f.t==='file') o[f.k]=el.files;
      else if(f.t==='number') o[f.k]= el.value===''?null:Number(el.value);
      else if(f.t==='password') o[f.k]=el.value; else o[f.k]= typeof el.value==='string'?el.value.trim():el.value; }); return o; };
  const refresh = () => { const vals=gather(); fields.forEach(f=>{ const w=form.querySelector(`[data-wrap="${f.k}"]`); if(w && f.show) w.style.display=f.show(vals)?'':'none';
      const wn=form.querySelector(`[data-warn="${f.k}"]`); if(wn) wn.textContent = f.validate ? (f.validate(vals[f.k], vals)||'') : ''; }); };
  form.addEventListener('input', refresh); form.addEventListener('change', refresh); refresh();
  $$('[data-x]',form).forEach(b=>b.onclick=()=>dlg.close());
  if(onDelete) $('[data-del]',form).onclick=()=>{ if(confirm('Delete this record?')){ onDelete(); dlg.close(); render(); } };
  form.onsubmit = async e => { e.preventDefault(); const vals=gather();
    const missing=fields.filter(f=>f.req && (!f.show||f.show(vals)) && (vals[f.k]==null||vals[f.k]===''||(f.t==='file'&&!vals[f.k].length)));
    if(missing.length){ $('#formErr').textContent='Please fill: '+missing.map(f=>f.l).join(', '); return; }
    try{ const r = await onSave(vals); if(r===false) return; }catch(err){ console.error(err); $('#formErr').textContent='Error: '+err.message; return; }
    dlg.close(); render(); };
  dlg.showModal();
  return dlg;
}
function showInfo(title, html){ const dlg=$('#dlg'); dlg.innerHTML=`<div class="dh"><h3>${esc(title)}</h3><button class="sm" data-x>✕</button></div><div class="db">${html}</div>`; $('[data-x]',dlg).onclick=()=>dlg.close(); dlg.showModal(); return dlg; }

/* ---------- table ---------- */
function table(rows, cols, {onRow, empty='No records yet.'}={}){
  if(!rows.length) return emptyBox(empty);
  const key='t'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{ if(onRow) $$(`[data-t="${key}"]`).forEach(tr=>tr.onclick=()=>onRow(rows[+tr.dataset.i])); });

const EMPTY_EMO=[[/photo/i,'📷'],[/withdrawal/i,'🌼'],[/calving/i,'🍼'],[/walk/i,'🥾'],[/paddock|field|grazed/i,'🌾'],[/milk/i,'🥛'],[/task|due today|scheduled/i,'🌞'],[/cow|animal|service|repeat/i,'🐄'],[/event|record/i,'📋']];

function emptyBox(msg, style=''){ msg=String(msg||'Nothing here yet.'); const e=(EMPTY_EMO.find(([r])=>r.test(msg))||[0,'🌻'])[1]; const cheer=/^(no|none|nothing|not )/i.test(msg)&&EMPTY_CHEER[e];

const PALETTE=['#2a9d5c','#0288d1','#f2a900','#d9473a','#7b1fa2','#00897b','#6d4c41','#546e7a'];
function setupCanvas(cv, h){ const dpr=window.devicePixelRatio||1; const w=cv.clientWidth||cv.parentElement.clientWidth||600; cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px'; const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); ctx.font='12px system-ui,sans-serif'; return {ctx,w,h}; }
function lineChart(cv, series, {height=220, yLabel=''}={}){
  if(!cv) return; const {ctx,w,h}=setupCanvas(cv,height);
  const pts=series.flatMap(s=>s.points);
  if(!pts.length){ ctx.fillStyle='#888'; ctx.textAlign='center'; ctx.fillText('No data yet',w/2,h/2); return; }
  const L=46,R=10,T=series.length>1?26:12,B=26;
  const xs=pts.map(p=>Date.parse(p[0]+'T00:00:00Z')); let x0=Math.min(...xs), x1=Math.max(...xs); if(x0===x1){x0-=864e5; x1+=864e5;}
  const ys=pts.map(p=>p[1]); let y1=Math.max(...ys)*1.1||1, y0=Math.min(0,Math.min(...ys));
  const X=t=>L+(t-x0)/(x1-x0)*(w-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(h-T-B);
  ctx.strokeStyle='#e3e6e3'; ctx.fillStyle='#66706a'; ctx.lineWidth=1; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){ const v=y0+(y1-y0)*i/4; const y=Y(v); ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(w-R,y); ctx.stroke(); ctx.fillText(num(v, v<10?1:0),L-6,y); }
  ctx.textAlign='center'; ctx.textBaseline='top';
  const nl=Math.min(6,Math.max(2,Math.floor((w-L)/80))); for(let i=0;i<=nl;i++){ const t=x0+(x1-x0)*i/nl; const d=new Date(t).toISOString().slice(0,10); ctx.textAlign=i===0?'left':i===nl?'right':'center'; ctx.fillText(fmtD(d).slice(0,5),X(t),h-B+6); }
  if(yLabel){ ctx.save(); ctx.translate(10,T+(h-T-B)/2); ctx.rotate(-Math.PI/2); ctx.textBaseline='middle'; ctx.fillText(yLabel,0,0); ctx.restore(); }
  series.forEach((s,si)=>{ const col=s.color||PALETTE[si%PALETTE.length]; const P=s.points.slice().sort((a,b)=>a[0]<b[0]?-1:1);
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2; ctx.beginPath(); P.forEach((p,i)=>{ const x=X(Date.parse(p[0]+'T00:00:00Z')), y=Y(p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    P.forEach(p=>{ ctx.beginPath(); ctx.arc(X(Date.parse(p[0]+'T00:00:00Z')),Y(p[1]),3,0,7); ctx.fill(); }); });
  if(series.length>1){ let lx=L; ctx.textAlign='left'; ctx.textBaseline='middle'; series.forEach((s,si)=>{ ctx.fillStyle=s.color||PALETTE[si%PALETTE.length]; ctx.fillRect(lx,8,12,8); ctx.fillStyle='#333'; ctx.fillText(s.label,lx+16,12); lx+=ctx.measureText(s.label).width+34; }); }
}
function barChart(cv, labels, values, {height=220, target=null, targetLabel='', colors}={}){
  if(!cv) return; const {ctx,w,h}=setupCanvas(cv,height);
  if(!values.length){ ctx.fillStyle='#888'; ctx.textAlign='center'; ctx.fillText('No data yet',w/2,h/2); return; }
  const L=46,R=10,T=12,B=40; const ymax=Math.max(...values, target||0)*1.1||1; const bw=(w-L-R)/values.length;
  const Y=v=>T+(1-v/ymax)*(h-T-B);
  ctx.strokeStyle='#e3e6e3'; ctx.fillStyle='#66706a'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){ const v=ymax*i/4; ctx.beginPath(); ctx.moveTo(L,Y(v)); ctx.lineTo(w-R,Y(v)); ctx.stroke(); ctx.fillText(num(v),L-6,Y(v)); }
  values.forEach((v,i)=>{ ctx.fillStyle=(colors&&colors[i])||'#3cb371'; const x=L+i*bw+bw*0.15; ctx.fillRect(x,Y(v),bw*0.7,Y(0)-Y(v));
    ctx.save(); ctx.fillStyle='#333'; ctx.translate(L+i*bw+bw/2,h-B+6); ctx.rotate(values.length>6?-0.6:0); ctx.textAlign=values.length>6?'right':'center'; ctx.textBaseline='top'; ctx.fillText(String(labels[i]).slice(0,12),0,0); ctx.restore(); });
  if(target){ ctx.strokeStyle='#c62828'; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.moveTo(L,Y(target)); ctx.lineTo(w-R,Y(target)); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle='#c62828'; ctx.textAlign='right'; ctx.textBaseline='bottom'; ctx.fillText(targetLabel,w-R,Y(target)-2); }
}

/* ---------- IndexedDB: photos waiting to upload (per user) ---------- */
const IDB_NAME='farmapp-v2';
let _db;
function idb(){ if(_db) return Promise.resolve(_db); return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('IndexedDB not available')); const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('pending')) d.createObjectStore('pending',{keyPath:'id'}); };
  r.onsuccess=()=>{ _db=r.result; res(_db); }; r.onerror=()=>rej(r.error); }); }
async function idbReq(store, mode, fn){ const d=await idb(); return new Promise((res,rej)=>{ const tx=d.transaction(store,mode); const st=tx.objectStore(store); const rq=fn(st); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); }); }
const idbAll = store => idbReq(store,'readonly',s=>s.getAll()).then(r=>r||[]);
const idbGet = (store,id) => idbReq(store,'readonly',s=>s.get(id));
const idbPut = (store,rec) => idbReq(store,'readwrite',s=>s.put(rec));
const idbDel = (store,id) => idbReq(store,'readwrite',s=>s.delete(id));
async function compressImage(file, max=1280, q=0.82){

    let {naturalWidth:w, naturalHeight:h}=img; const s=Math.min(1, max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);

}
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
const dataURLToBlob = async d => (await fetch(d)).blob();
const blobURLs=new Map();      // photo id -> object URL for photos still on this device
const signedCache=new Map();   // storage path -> {url, exp}
async function loadPendingBlobs(){ try{ (await idbAll('pending')).filter(p=>p.uid===UID).forEach(p=>{ if(!blobURLs.has(p.id)) blobURLs.set(p.id, URL.createObjectURL(p.blob)); }); }catch(e){} }

async function signedURLs(paths){

  if(need.length && navigator.onLine && sb){ for(const c of chunk(need,100)){ const {data,error}=await sb.storage.from('photos').createSignedUrls(c,3600); if(!error&&data) data.forEach(d=>{ if(d.signedUrl) signedCache.set(d.path,{url:d.signedUrl,exp:Date.now()+3600e3}); }); } }
  return paths.map(p=>signedCache.get(p)?.url||''); }
async function photoURLs(list){ const s=await signedURLs(list.map(p=>blobURLs.has(p.id)?null:p.path)); return list.map((p,i)=>blobURLs.get(p.id)||s[i]); }
async function photoBlob(p){ const pend=await idbGet('pending',p.id).catch(()=>null); if(pend) return pend.blob; const {data,error}=await sb.storage.from('photos').download(p.path); if(error) throw error; return data; }
let mapBgURL=null;
async function loadMapBg(){ const bg=S.settings.mapBg; if(!bg||!bg.path){ mapBgURL=null; return null; } if(mapBgURL && mapBgURL.startsWith('blob:')) return mapBgURL; const [u]=await signedURLs([bg.path]); mapBgURL=u||null; return mapBgURL; }
/* ---------- domain logic ---------- */
function polyAreaUnits(pts){ let a=0; for(let i=0;i<pts.length;i++){ const [x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length]; a+=x1*y2-x2*y1; } return Math.abs(a)/2; }
function hasGeo(p){ return !!p && Array.isArray(p.geo) && p.geo.length>=3; }
function hasSketch(p){ return !!p && Array.isArray(p.points) && p.points.length>=3; }
function geoAreaM2(ll){ if(!ll||ll.length<3) return 0; // field-sized polygons: local projection using WGS84 ellipsoid radii at the mean latitude (within ~0.01% of a geodesic calculation)
  const d=Math.PI/180, a=6378137, e2=0.00669437999014; const lat0=ll.reduce((t,q)=>t+q[0],0)/ll.length*d, lon0=ll[0][1]; const w=1-e2*Math.sin(lat0)**2;
  const M=a*(1-e2)/Math.pow(w,1.5), N=a/Math.sqrt(w); const xy=ll.map(q=>[(q[1]-lon0)*d*N*Math.cos(lat0), (q[0]*d-lat0)*M]);
  let A=0; for(let i=0;i<xy.length;i++){ const [x1,y1]=xy[i], [x2,y2]=xy[(i+1)%xy.length]; A+=x1*y2-x2*y1; } return Math.abs(A)/2; }
const haToAc = h => (Number(h)||0)*2.4710538;
const roundGeo = ll => ll.map(q=>[+(+q[0]).toFixed(7), +(+q[1]).toFixed(7)]);
function mappedHa(p){ if(hasGeo(p)) return geoAreaM2(p.geo)/1e4; return hasSketch(p) ? polyAreaUnits(p.points)*Math.pow(S.settings.mPerUnit||1,2)/10000 : 0; }
function padHa(p){ return (p.areaManual>0) ? Number(p.areaManual) : mappedHa(p); }
function centroid(pts){ let x=0,y=0; pts.forEach(p=>{x+=p[0];y+=p[1];}); return [x/pts.length,y/pts.length]; }
function grazingsFor(pid){ return S.grazings.filter(g=>g.paddockId===pid).sort(byDate('dateIn')); }
function walksFor(pid){ return S.grassWalks.filter(w=>w.paddockId===pid).sort(byDate('date')); }
function currentGrazing(pid){ return S.grazings.find(g=>g.paddockId===pid && !g.dateOut); }
function lastGrazedDate(pid){ if(currentGrazing(pid)) return today(); const g=grazingsFor(pid).filter(g=>g.dateOut)[0]; return g?g.dateOut:null; }
function daysSinceGrazed(pid){ const d=lastGrazedDate(pid); return d==null?null:daysBetween(d,today()); }
/* measured growth (kg DM/ha/day) from consecutive walks with no grazing in between */
function measuredGrowth(pid){
  const w=walksFor(pid).slice().reverse(); // oldest first
  for(let i=w.length-1;i>0;i--){ const a=w[i-1], b=w[i]; const d=daysBetween(a.date,b.date); if(d<=0) continue;
    const grazedBetween=S.grazings.some(g=>g.paddockId===pid && (g.dateIn<=b.date) && (!g.dateOut || g.dateOut>=a.date));
    if(!grazedBetween) return {rate:(b.cover-a.cover)/d, from:a.date, to:b.date}; }
  return null;
}
function farmMeasuredGrowth(){ const r=S.paddocks.map(p=>measuredGrowth(p.id)).filter(Boolean).filter(m=>daysBetween(m.to,today())<=21); return r.length?sum(r.map(m=>m.rate))/r.length:null; }
/* simple, clearly-labelled ESTIMATE of daily growth from forecast weather */
function weatherGrowthEstimate(soilT, rain, rain7){
  if(soilT==null) return null; let g = soilT<=5 ? 0 : Math.min(100,(soilT-5)*9);
  if(rain7!=null && rain7<7) g*=0.75;     // dry spell
  if(rain!=null && rain>25) g*=0.8;       // waterlogging / poor utilisation
  return Math.round(g);
}
function currentGrowthRate(){
  const s=S.settings, gd=growthDays(wxForHere(getWeatherCache())).filter(d=>d.growth!=null);
  const wxG = gd.length ? Math.round(sum(gd.slice(0,3).map(d=>d.growth))/Math.min(3,gd.length)) : null;
  const meas = farmMeasuredGrowth();
  if(s.growthSource==='manual') return {rate:Number(s.manualGrowth)||0, basis:'manual setting'};
  if(s.growthSource==='weather' && wxG!=null) return {rate:wxG, basis:'weather estimate'};
  if(s.growthSource==='measured' && meas!=null) return {rate:Math.round(meas), basis:'measured walks'};
  if(s.growthSource==='auto'){ if(meas!=null) return {rate:Math.round(meas), basis:'measured walks (last 21 days)'}; if(wxG!=null) return {rate:wxG, basis:'weather estimate'}; }
  return {rate:Number(s.manualGrowth)||0, basis:'manual setting (fallback)'};
}
function coverInfo(p){
  const w=walksFor(p.id)[0]; const gs=grazingsFor(p.id); const cur=currentGrazing(p.id); const lastOut=gs.find(g=>g.dateOut);
  let base=null, baseDate=null, basis='';
  if(lastOut && (!w || lastOut.dateOut>=w.date)){ base=S.settings.residual; baseDate=lastOut.dateOut; basis='post-grazing residual'; }
  else if(w){ base=w.cover; baseDate=w.date; basis='grass walk'; }
  if(base==null) return {est:null};
  const days=Math.max(0,daysBetween(baseDate,today()));
  const g = cur ? 0 : currentGrowthRate().rate;
  return {est:Math.max(0,Math.round(base+g*days)), base, baseDate, basis, days, grazingNow:!!cur};
}
function grazingPaddocks(){ return S.paddocks.filter(p=>!['silage','reseeding'].includes(p.status)); }
function herdDemandCows(){ return S.settings.demandCows>0 ? Number(S.settings.demandCows) : S.cows.filter(c=>c.status==='milking').length; }
function grassBudget(){
  const ps=grazingPaddocks(); const area=sum(ps.map(padHa)); const res=Number(S.settings.residual)||0;
  let totalKg=0, availKg=0, known=0;
  ps.forEach(p=>{ const ci=coverInfo(p); if(ci.est==null) return; known++; totalKg+=ci.est*padHa(p); availKg+=Math.max(0,ci.est-res)*padHa(p); });
  const cows=herdDemandCows(), kg=Number(S.settings.kgDmPerCow)||0, demand=cows*kg;
  return {area, afc: area?totalKg/area:null, availKg, cows, demand, daysAhead: demand?availKg/demand:null, demandPerHa: area?demand/area:null, known, n:ps.length, coverPerCow: cows?totalKg/cows:null};
}
function coverColour(c){ if(c==null) return '#cfd5cf'; if(c<500) return '#e57373'; if(c<900) return '#ffb74d'; if(c<1300) return '#c5e1a5'; if(c<1800) return '#66bb6a'; return '#1b5e20'; }

/* withdrawal */
/* organic: withdrawal = double the label period, minimum 48 h (EU Reg 2018/848 Annex II) — applied when the treatment has orgDouble */
function wdDays(v, dbl){ const has=v!=null&&v!==''; if(!dbl) return has?Math.ceil(Number(v)):null; return Math.max(2, Math.ceil(2*(Number(has?v:0)||0))); }
function wdEnds(t){ const last=addDays(t.date, Math.max(0,(Number(t.courseDays)||1)-1)); const d=!!t.orgDouble; const m=wdDays(t.milkWd,d), mt=wdDays(t.meatWd,d);
  return {last, milk: m!=null ? addDays(last, m) : null, meat: mt!=null ? addDays(last, mt) : null, doubled:d}; }
function inWithdrawal(){ const td=today(); const out=[];
  S.treatments.forEach(t=>{ const e=wdEnds(t); const milk=e.milk&&e.milk>=td, meat=e.meat&&e.meat>=td; if(milk||meat) out.push({t, milkEnd:milk?e.milk:null, meatEnd:meat?e.meat:null}); });
  return out.sort((a,b)=>((a.milkEnd||a.meatEnd)<(b.milkEnd||b.meatEnd)?-1:1)); }
function cowWithdrawal(cid){ return inWithdrawal().filter(w=>w.t.cowId===cid); }

/* breeding */
const GESTATION=283;
function breedingFor(cid){ return S.breeding.filter(b=>b.cowId===cid).sort(byDate('date')); }
function dueInfo(c){
  const ev=breedingFor(c.id); const svc=ev.find(e=>e.type==='service'); if(!svc) return null;
  const after=ev.filter(e=>e.date>=svc.date && e!==svc);
  if(after.some(e=>e.type==='calving')) return null;
  const scan=after.find(e=>e.type==='scan');
  if(scan && scan.result==='empty') return null;
  let due=addDays(svc.date,GESTATION), basis='service '+fmtD(svc.date);
  if(scan && scan.result==='in-calf' && scan.foetalAgeDays>0){ due=addDays(scan.date, GESTATION-Number(scan.foetalAgeDays)); basis='scan foetal age'; }
  return {cow:c, svc, scan, due, basis, days:daysBetween(today(),due), confirmed: !!(scan&&scan.result==='in-calf')};
}
function dueList(){ return activeCows().map(dueInfo).filter(Boolean).sort((a,b)=>a.due<b.due?-1:1); }

/* milk */
function milkDailyTotals(){ // per date: bulk total if any bulk records, else sum of per-cow
  const m={}; S.milk.forEach(r=>{ const d=m[r.date]||(m[r.date]={bulk:0,cow:0,nb:0}); if(r.kind==='bulk'){ d.bulk+=Number(r.litres)||0; d.nb++; } else d.cow+=Number(r.litres)||0; });
  return Object.entries(m).map(([date,v])=>({date, litres: v.nb?v.bulk:v.cow, basis:v.nb?'bulk':'cows'})).sort((a,b)=>a.date<b.date?-1:1);
}

/* tasks */
const RECUR={none:'One-off',daily:'Daily',weekly:'Weekly',fortnightly:'Every 2 weeks',monthly:'Monthly',yearly:'Yearly'};
function nextDue(d, r){ if(r==='daily') return addDays(d,1); if(r==='weekly') return addDays(d,7); if(r==='fortnightly') return addDays(d,14);
  const [y,m,dd]=d.split('-').map(Number); if(r==='monthly'){ const nd=new Date(Date.UTC(y,m,1)); const last=new Date(Date.UTC(nd.getUTCFullYear(),nd.getUTCMonth()+1,0)).getUTCDate(); nd.setUTCDate(Math.min(dd,last)); return nd.toISOString().slice(0,10); }
  if(r==='yearly') return `${y+1}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`; return null; }
function completeTask(t){ upd('tasks',t.id,{done:true, doneAt:nowISO()});
  if(t.recur && t.recur!=='none' && t.due){ let nd=nextDue(t.due,t.recur); while(nd && nd<today() ) nd=nextDue(nd,t.recur);
    const {id,createdAt,updatedAt,done,doneAt,...rest}=t; add('tasks',{...rest, due:nd, done:false, prevId:t.id}); toast('Done — next due '+fmtD(nd)); } else toast('Task done'); }

function scanRate(r){ const e=Number(r.ewes)||0; if(!e) return ''; const l=(Number(r.singles)||0)+2*(Number(r.twins)||0)+3*(Number(r.triplets)||0); return `${num(l/e,2)} lambs/ewe scanned`; }
function groupOpts(sp){ return [['','—']].concat(S.groups.filter(g=>g.species===sp&&!g.closed).map(g=>[g.id,g.name])); }
const groupName = id => get('groups',id)?.name||'';
function spEvents(sp, kind){ return S.stockEvents.filter(e=>e.species===sp&&(!kind||e.kind===kind)).sort(byDate()); }
function groupHead(g){ let n=Number(g.count)||0; S.stockEvents.filter(e=>e.groupId===g.id).forEach(e=>{ if(e.kind==='mortality'||e.kind==='sale') n-=Number(e.count)||0; }); return Math.max(0,n); }
function sheepKpis(){ const yr=today().slice(0,4); const ewes=S.cows.filter(c=>c.species==='sheep'&&c.status==='ewe').length+sum(S.groups.filter(g=>g.species==='sheep'&&!g.closed).map(g=>g.ewes));
  const lb=spEvents('sheep','lambing').filter(e=>(e.date||'').startsWith(yr)); const born=sum(lb.map(e=>e.born)), lost=sum(lb.map(e=>e.lost)); const sc=spEvents('sheep','scan')[0];
  return [[ewes||'–','Ewes (register + batches)'],[born,`Lambs born ${yr}`],[born?num(100*lost/born,1)+'%':'–','Lamb losses'],[lb.length?`${lb.filter(e=>e.born==1).length}/${lb.filter(e=>e.born==2).length}/${lb.filter(e=>e.born>=3).length}`:'–','Singles / twins / triplets'],[sc?scanRate(sc).split(' ')[0]:'–','Scanning rate (lambs/ewe)']]; }
function pigKpis(){ const sows=S.cows.filter(c=>c.species==='pigs'&&['sow','gilt'].includes(c.status)).length; const pens=S.groups.filter(g=>g.species==='pigs'&&!g.closed);
  const fr=spEvents('pigs','farrow').slice(0,20); const bal=fr.length?sum(fr.map(e=>e.alive))/fr.length:null;
  return [[sows,'Sows & gilts'],[sum(pens.map(groupHead)),'Pigs in pens'],[bal!=null?num(bal,1):'–','Born alive per litter'],[S.settings.pigHerdNo||'–','Pig herd number']]; }
function poultryKpis(){ const fl=S.groups.filter(g=>g.species==='poultry'&&!g.closed); const birds=sum(fl.map(groupHead)); const td=today();
  const eg=spEvents('poultry','eggs').filter(e=>daysBetween(e.date,td)<7&&daysBetween(e.date,td)>=0); const eggs=sum(eg.map(e=>e.eggs));
  return [[birds,'Birds on farm'],[eggs,'Eggs last 7 days'],[birds?num(100*eggs/(birds*7),0)+'%':'–','Lay rate (7 days)'],[sum(spEvents('poultry','mortality').filter(e=>daysBetween(e.date,td)<30).map(e=>e.count)),'Mortality 30 days']]; }
function fcrFor(g){ const w=S.stockEvents.filter(e=>e.groupId===g.id&&e.kind==='weigh').sort(byDate('date',1)); const pts=[...(g.startKg?[{date:g.start,weight:g.startKg,count:g.count}]:[]),...w]; if(pts.length<2) return null; const a=pts[0], b=pts[pts.length-1];
  const gain=(Number(b.weight)*(Number(b.count)||Number(a.count)||0))-(Number(a.weight)*(Number(a.count)||0)); const feed=sum(S.stockEvents.filter(e=>e.groupId===g.id&&e.kind==='feed'&&e.date>=a.date&&e.date<=b.date).map(e=>e.feedKg));
  if(gain<=0||!feed) return null; const days=daysBetween(a.date,b.date); return {fcr:feed/gain, adg:days?(b.weight-a.weight)/days:null}; }
function adgFor(cid){ const w=S.stockEvents.filter(e=>e.kind==='weigh'&&e.animalId===cid&&e.weight).sort(byDate('date',1)); if(w.length<2) return null; const a=w[w.length-2], b=w[w.length-1]; const d=daysBetween(a.date,b.date); const L=daysBetween(w[0].date,b.date);
  return d>0?{adg:(b.weight-a.weight)/d, life:L>0?(b.weight-w[0].weight)/L:null}:null; }

function organicAnimalNotes(sp){ const a=approach(); if(a==='conventional') return '';
  const conv={sheep:'6 months',goats:'6 months (milk 6 months)',pigs:'6 months',poultry:'10 weeks for meat birds (brought in before 3 days old), 6 weeks for laying hens',horses:'12 months and at least three-quarters of lifetime',cattle:'12 months and at least three-quarters of lifetime for meat; 6 months for milk'}[sp]||'see your certification body';
  return `<div class="card orgcard"><h3>🍃 ${a==='organic'?'Organic':'Mostly organic'}: animal health notes</h3><ul class="olist">
   <li><b>Prevention first:</b> suitable breeds, clean grazing and rotation, low stocking, and faecal egg counts (FEC) before dosing. Dose only the animals that need it, not routinely.</li>
   <li><b>Withdrawal periods:</b> after any chemically-synthesised veterinary medicine the withdrawal is <b>double the label period, and at least 48 hours</b>. Treatments recorded here ${a==='organic'?'apply this automatically':'can apply it with the “organic double withdrawal” box'}.</li>
   <li><b>Treatment limits:</b> more than 3 courses of synthetic allopathic medicines in 12 months (1 course if the productive life is under a year) means the animal can’t be sold as organic. Vaccines, parasite treatments and compulsory schemes don’t count towards this.</li>
   <li><b>Conversion:</b> ${esc(conv)}${['cattle','sheep','goats'].includes(sp)?'. Land conversion is 2 years for grassland and annual crops':''}.</li>
   <li><b>Stocking rate:</b> livestock manure is limited to <b>170 kg N/ha/year</b> across the farm (roughly 2 dairy cows, 13 ewes or 6.5 sows per ha). Organic farms can’t use the nitrates derogation.</li>
   ${['sheep','cattle','goats'].includes(sp)?'<li><b>Parasites & fluke:</b> mixed or alternate grazing with other species, aftergrass or reseeds for weaned stock, fence off wet areas (fluke snails), and quarantine-treat bought-in animals.</li>':''}
   ${['pigs','poultry'].includes(sp)?'<li><b>Outdoor access</b> and space allowances apply. Organic feed (with limited exceptions) and no routine preventive medicines.</li>':''}
  </ul><p class="hint">Guide only: confirm the current rules with your certification body (IOA / Organic Trust) and your vet. ${a==='organic'?'':'“Mostly organic” is not certified.'}</p></div>`; }

   ${hasType('pigs')?`<label class="f" style="margin:12px 0 0"><span>Pig herd number</span><input id="sPigHerd" value="${esc(S.settings.pigHerdNo||'')}" placeholder="DAFM pig herd number"></label>`:''}</div>
  <div class="card" id="approachCard"><h2>🌿 Farming approach</h2><div class="appr">${Object.entries(APPROACHES).map(([k,v])=>`<label class="achoice ${a===k?'on':''}"><input type="radio" name="appr" value="${k}" ${a===k?'checked':''}><b>${v.i} ${esc(v.l)}</b><span>${esc(v.d)}</span></label>`).join('')}</div>

   <ul class="tablist" id="tabList">${tabs.map((k,i)=>{ const [ic,l]=tabLabel(k); const on=tabOn(k); const def=defaultTabOn(k);
     return `<li draggable="true" data-tab="${k}" class="${on?'':'off'}"><span class="drag" aria-hidden="true">☰</span><span class="tl">${ic} ${esc(l)}${def?'':' <span class="pill">extra</span>'}</span>
       <button class="sm ar" data-up="${k}" aria-label="Move ${esc(l)} up" ${i===0?'disabled':''}>▲</button><button class="sm ar" data-down="${k}" aria-label="Move ${esc(l)} down" ${i===tabs.length-1?'disabled':''}>▼</button>
       <label class="sw"><input type="checkbox" data-vis="${k}" ${on?'checked':''} ${k==='dash'?'disabled':''} aria-label="Show ${esc(l)} tab${k==='dash'?' (always shown)':''}"><i></i></label></li>`; }).join('')}</ul>

function bindFarmSetup(el){ const s=S.settings;
  $$('[data-ft]',el).forEach(cb=>cb.onchange=()=>{ const t=$$('[data-ft]',el).filter(x=>x.checked).map(x=>x.dataset.ft); if(!t.length){ toast('Pick at least one farm type'); cb.checked=true; return; } s.farmTypes=t; save(); render(); toast('Farm types saved'); });
  const ph=$('#sPigHerd',el); if(ph) ph.onchange=()=>{ s.pigHerdNo=ph.value.trim(); save(); };
  $$('input[name=appr]',el).forEach(r=>r.onchange=()=>{ s.approach=r.value; save(); render(); toast(APPROACHES[r.value].l+' selected'); });
  const prefs=()=>{ const p=s.tabPrefs&&typeof s.tabPrefs==='object'?s.tabPrefs:{}; s.tabPrefs={order:Array.isArray(p.order)?p.order:[],vis:{...(p.vis||{})}}; return s.tabPrefs; };
  const keepScroll=fn=>{ const y=$('#tabsCard')?.getBoundingClientRect().top; fn(); const n=$('#tabsCard'); if(n&&y!=null) window.scrollBy(0,n.getBoundingClientRect().top-y); };
  const move=(k,d)=>{ const o=tabOrder(); const i=o.indexOf(k), j=i+d; if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; prefs().order=o; save(); keepScroll(render); setTimeout(()=>$(`[data-tab="${k}"] [data-${d<0?'up':'down'}]`)?.focus()); };
  $$('[data-up]',el).forEach(b=>b.onclick=()=>move(b.dataset.up,-1)); $$('[data-down]',el).forEach(b=>b.onclick=()=>move(b.dataset.down,1));
  $$('[data-vis]',el).forEach(cb=>cb.onchange=()=>{ prefs().vis[cb.dataset.vis]=cb.checked; save(); renderNav(); cb.closest('li').classList.toggle('off',!cb.checked); });
  $('#tabReset',el).onclick=()=>{ s.tabPrefs=null; save(); keepScroll(render); toast('Tabs reset to defaults'); };
  let dragK=null; const ul=$('#tabList',el);
  $$('li[data-tab]',ul).forEach(li=>{ li.ondragstart=e=>{ dragK=li.dataset.tab; li.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragK); }catch(_){} };
    li.ondragend=()=>li.classList.remove('dragging'); li.ondragover=e=>{ e.preventDefault(); li.classList.add('over'); }; li.ondragleave=()=>li.classList.remove('over');
    li.ondrop=e=>{ e.preventDefault(); li.classList.remove('over'); const to=li.dataset.tab; if(!dragK||dragK===to) return; const cur=tabOrder(); const down=cur.indexOf(dragK)<cur.indexOf(to); const o=cur.filter(k=>k!==dragK); o.splice(o.indexOf(to)+(down?1:0),0,dragK); prefs().order=o; save(); keepScroll(render); }; }); }
function cropCreditsHTML(){ const c=CROPIDX?.credits;
  const guide='<li><b>Crop guidance:</b> summarised from Teagasc publications (Green Book, crop and horticulture guides), DAFM, the Nitrates Regulations and EU organic rules (Reg 2018/848 and 2021/1165). Irish heritage apple data: <a href="https://irishseedsavers.ie" target="_blank" rel="noopener">Irish Seed Savers Association</a>. Guide only.</li>';
  if(!c) return '<li id="cropCred"><b>Crop photos:</b> Wikimedia Commons contributors (open the crop library once to list them).</li>'+guide;
  return `<li id="cropCred"><b>Crop photos</b> (${c.length} resized thumbnails) from <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>, used under their free licences (CC BY, CC BY-SA, CC0 or public domain); cropped and resized. <details><summary>Show all ${c.length} photo credits</summary><ul class="pcredits">${c.map(x=>`<li>${esc(x.name)}: ${esc(x.author)}, <a href="${esc(x.source)}" target="_blank" rel="noopener">${esc(x.licence)}</a></li>`).join('')}</ul></details></li>${guide}`; }

VIEWS.dash = el => {

  const wd=inWithdrawal(); const due=dueList().filter(d=>d.days<=42);

  const gb=grassBudget(); const herd=activeCows();

  const crops=hasType('tillage','horticulture','fruit','forestry'); const pls=S.plantings.filter(p=>!['finished'].includes(p.status));

  if(D) k('🥛', `${last?num(last.litres):'–'} L`, `Milk ${last?fmtD(last.date):''}${last&&prev?` (${last.litres>=prev.litres?'▲':'▼'} ${num(Math.abs(last.litres-prev.litres))} L)`:''}`, 'sky');
  k('💊', wd.length, 'In withdrawal', wd.length?'warn':'');
  if(cattle) k('🍼', due.length, 'Calving ≤ 6 weeks');
  if(Bf){ const a=activeCows().map(c=>adgFor(c.id)).filter(Boolean); k('⚖️', a.length?num(sum(a.map(x=>x.adg))/a.length,2):'–', 'Avg daily gain kg (beef)'); }
  if(hasType('sheep')){ const sk=sheepKpis(); k('🐑', sk[0][0], sk[0][1]); k('🐣', sk[1][0], sk[1][1]); }
  if(hasType('pigs')){ const pk=pigKpis(); k('🐖', pk[0][0], pk[0][1]); k('🐷', pk[1][0], pk[1][1]); }
  if(hasType('poultry')){ const qk=poultryKpis(); k('🐔', qk[0][0], qk[0][1]); k('🥚', qk[1][0], qk[1][1]); }
  if(hasType('goats')) k('🐐', S.cows.filter(c=>c.species==='goats'&&!['sold','died'].includes(c.status)).length, 'Goats');
  if(hasType('horses')) k('🐎', S.cows.filter(c=>c.species==='horses'&&!['sold','died'].includes(c.status)).length, 'Horses');
  if(crops) k('🌾', pls.length, 'Active plantings');
  k('⏰', overdue.length, 'Overdue tasks', overdue.length?'warn':'');
  if(grazing) k('🌱', gb.daysAhead!=null?num(gb.daysAhead,1):'–', 'Days grass ahead (est.)');
  const recentOps=S.cropOps.filter(o=>daysBetween(o.date,td)<=30).sort(byDate()).slice(0,6);
  el.innerHTML = `
  ${isEmpty?`<div class="card"><div style="font-size:44px;line-height:1">🌻${farmTypes().slice(0,3).map(t=>FARM_TYPES[t]?.i||'').join('')}🌱</div><h2>Welcome to your farm 👋</h2><p>No records yet. Start by drawing your fields on the <a href="#map">Map</a>${cattle?', adding <a href="#cows">cattle</a>':''}${crops?', or adding a planting from the <a href="#croplib">crop library</a>':''}. Or <button class="sm" id="demoBtn">Load demo data</button> to explore.</p><p class="mut">Pick your <a href="#settings">farm types</a> (dairy, beef, sheep, pigs, crops…) in ⚙️ Settings to get the right tabs. Records are saved to your account and kept on this phone for offline use.</p></div>`:''}
  <div class="kpis">${K.join('')}</div>
  <div class="grid">
    <div class="card"><h3>✅ Today's tasks</h3>${taskList([...overdue,...dueToday],'Nothing due today 🎉')}<div class="row" style="margin-top:8px"><button class="sm" id="addTask">+ Task</button><a class="btn sm" href="#tasks">All tasks</a></div></div>
    <div class="card" style="${wd.length?'border-color:#ffb4a8;box-shadow:0 6px 0 #ffd5ce,0 10px 24px #0000000f':''}"><h3>💊 Animals in withdrawal</h3>${wd.length?`<ul class="list">${wd.map(w=>`<li><div class="grow"><b>${esc(w.t.cowId?cowName(w.t.cowId):w.t.groupDesc||'Group')}</b><div class="mut">${esc(w.t.product)}${w.t.orgDouble?' · organic ×2':''}</div></div><div style="text-align:right">${w.milkEnd?`<span class="pill red">Milk to ${fmtD(w.milkEnd)}</span><br>`:''}${w.meatEnd?`<span class="pill amb">Meat to ${fmtD(w.meatEnd)}</span>`:''}</div></li>`).join('')}</ul>`:emptyBox('No animals in withdrawal.')}</div>
    ${cattle?`<div class="card"><h3>🍼 Upcoming calvings</h3>${due.length?`<ul class="list">${due.slice(0,8).map(d=>`<li><div class="grow"><a href="#cow/${d.cow.id}">${esc(cowLabel(d.cow))}</a><div class="mut">Due ${fmtD(d.due)} · ${d.confirmed?'scanned in-calf':'not yet scanned'}</div></div><span class="pill ${d.days<0?'red':d.days<=7?'amb':'grn'}">${d.days<0?Math.abs(d.days)+'d over':d.days+' days'}</span></li>`).join('')}</ul>`:emptyBox('No calvings due in the next 6 weeks.')}</div>`:''}
    ${D?`<div class="card"><h3>🥛 Milk (last 14 days)</h3><canvas class="chart" id="dashMilk"></canvas></div>`:''}
    ${crops?`<div class="card"><h3>🌾 Plantings</h3><div id="dashPl">${plantingTable(pls.slice(0,6))}</div>${recentOps.length?`<div class="mut" style="margin-top:8px">Last 30 days: ${recentOps.map(o=>esc((OP_KINDS[o.kind]?.i||'')+' '+(get('plantings',o.plantingId)?.cropName||''))).join(', ')}</div>`:''}<div class="row" style="margin-top:8px"><a class="btn sm" href="#croplib">📚 Crop library</a></div></div>`:''}
    <div class="card" style="grid-column:1/-1"><h3>🌦️ Weather${grazing?' & grass':''}</h3><div id="dashWx">${wxStrip(getWeatherCache())}</div>
      ${grazing?`<p class="mut" style="margin-bottom:0">Average farm cover: <b>${gb.afc!=null?num(gb.afc):'–'} kg DM/ha</b> · Growth used: <b>${num(currentGrowthRate().rate)} kg DM/ha/day</b> (${esc(currentGrowthRate().basis)}) · Demand: ${gb.cows} cows × ${num(S.settings.kgDmPerCow)} kg — <i>estimates</i>. <a href="#grass">Grass planner →</a></p>`:''}</div>
  </div>`;
  bindTaskList(el); const dp=$('#dashPl',el); if(dp){ bindPlantingTable(dp); if(!CROPIDX) loadCropIndex().then(()=>{ const x=$('#dashPl'); if(x){ x.innerHTML=plantingTable(pls.slice(0,6)); bindPlantingTable(x); } }).catch(()=>{}); }
  $('#addTask',el).onclick=()=>taskForm();
  const db=$('#demoBtn',el); if(db) db.onclick=()=>{ loadDemo(); render(); };
  if(D){ const pts=mt.filter(d=>daysBetween(d.date,td)<=14).map(d=>[d.date,d.litres]); lineChart($('#dashMilk',el),[{label:'Litres/day',points:pts}],{height:180,yLabel:'L'}); }
  fetchWeather().then(wx=>{ const d=$('#dashWx'); if(d && route==='dash') d.innerHTML=wxStrip(wx); });

/* old 'sketch' map (paddocks drawn in map units on a plain grid or uploaded image). Kept so paddocks drawn before v3 still show and can be edited. */
function sketchView(el){
  const s=S.settings; if(!MAP.vb) MAP.vb={x:0,y:0,w:s.mapW,h:s.mapH};
  const drawing=MAP.mode!=='view';
  el.innerHTML=`
  <div class="row">
    ${drawing?`<button class="sm" id="mUndo">↶ Undo point</button>${MAP.mode==='draw'?'<button class="sm pri" id="mFinish">✔ Finish paddock</button>':''}<button class="sm" id="mCancel">Cancel</button>`
    :`<button class="pri" id="mSat">🛰 Back to satellite map</button><button class="sm" id="mNew">+ Draw on sketch</button><button class="sm" id="mNoMap">+ Add without map</button>`}
    <span class="sp"></span>
    <button class="sm ${MAP.colour==='status'?'on':''}" id="cStatus">Status</button><button class="sm ${MAP.colour==='cover'?'on':''}" id="cCover">Grass cover</button>
    <button class="sm" id="zIn" aria-label="Zoom in">＋</button><button class="sm" id="zOut" aria-label="Zoom out">－</button><button class="sm" id="zFit">Fit</button>
  </div>
  <div class="banner">This is the <b>old sketch map</b> (not to real-world position). New fields are best drawn on the satellite map. Paddocks drawn here still keep their area.</div>
  <div id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>${drawing?`<div class="maphelp">${MAP.mode==='draw'?`Tap the map to add corner points (${MAP.pts.length} so far). Drag to pan. Press <b>Finish</b> when done (min 3 points).`:`Calibrate scale: tap two points a known distance apart (${MAP.calib.length}/2).`}</div>`:''}</div>
  <div class="legend">${MAP.colour==='status'?Object.values(PAD_STATUS).map(v=>`<span><i style="background:${v.c}"></i>${v.l}</span>`).join(''):[[0,'<500'],[600,'500–900'],[1000,'900–1300'],[1500,'1300–1800'],[2000,'1800+']].map(([v,l])=>`<span><i style="background:${coverColour(v)}"></i>${l}</span>`).join('')+'<span><i style="background:#cfd5cf"></i>no data</span> <span class="mut">kg DM/ha (estimated)</span>'}</div>
  <div class="row mut" style="margin-top:8px">Scale: 1 map unit = ${num(s.mPerUnit,3)} m <button class="sm" id="mCalib">Calibrate scale</button><button class="sm" id="mBg">Background image…</button>${mapBgURL?'<button class="sm danger" id="mBgDel">Remove image</button>':''}<input type="file" id="bgFile" accept="image/*" hidden></div>
  <div id="padDetail"></div>
  <div class="card"><h3>Paddocks (${S.paddocks.length}) · ${num(sum(S.paddocks.map(padHa)),2)} ha</h3><div id="padTable"></div></div>`;
  drawMap();
  $('#padTable',el).innerHTML=table(S.paddocks.slice().sort((a,b)=>a.name.localeCompare(b.name)),[
    {l:'Name',k:'name'},{l:'ha',f:p=>num(padHa(p),2)},{l:'Status',h:p=>`<span class="pill" style="background:${PAD_STATUS[p.status]?.c||'#ccc'}33">${esc(PAD_STATUS[p.status]?.l||p.status)}</span>`},
    {l:'Cover (est.)',f:p=>{const c=coverInfo(p); return c.est==null?'–':num(c.est);}},{l:'Days since grazed',f:p=>{const d=daysSinceGrazed(p.id); return d==null?'–':d;}}],
    {onRow:p=>{MAP.sel=p.id; drawMap(); showPadDetail(); $('#padDetail').scrollIntoView({behavior:'smooth'});}, empty:'No paddocks yet — tap “Draw paddock”.'});
  showPadDetail();
  const B=(id,fn)=>{ const b=$('#'+id,el); if(b) b.onclick=fn; };
  B('mNew',()=>{ MAP.mode='draw'; MAP.pts=[]; MAP.redrawId=null; MAP.sel=null; render(); });
  B('mNoMap',()=>paddockForm(null,null)); B('mSat',()=>{ MAP.view='sat'; MAP.mode='view'; MAP.pts=[]; MAP.calib=[]; MAP.redrawId=null; render(); });
  B('mUndo',()=>{ if(MAP.mode==='draw') MAP.pts.pop(); else MAP.calib.pop(); render(); });
  B('mCancel',()=>{ MAP.mode='view'; MAP.pts=[]; MAP.calib=[]; MAP.redrawId=null; render(); });
  B('mFinish',()=>{ if(MAP.pts.length<3) return toast('Add at least 3 points');
    const pts=MAP.pts.map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)]);
    if(MAP.redrawId){ upd('paddocks',MAP.redrawId,{points:pts}); MAP.sel=MAP.redrawId; MAP.mode='view'; MAP.pts=[]; MAP.redrawId=null; render(); toast('Boundary updated'); }
    else paddockForm(null, pts); });
  B('cStatus',()=>{MAP.colour='status'; render();}); B('cCover',()=>{MAP.colour='cover'; render();});
  const zoom=f=>{ const v=MAP.vb; const cx=v.x+v.w/2, cy=v.y+v.h/2; v.w*=f; v.h*=f; v.x=cx-v.w/2; v.y=cy-v.h/2; drawMap(); };
  B('zIn',()=>zoom(0.7)); B('zOut',()=>zoom(1/0.7)); B('zFit',()=>{ MAP.vb={x:0,y:0,w:s.mapW,h:s.mapH}; drawMap(); });
  B('mCalib',()=>{ MAP.mode='calib'; MAP.calib=[]; render(); });
  B('mBg',()=>$('#bgFile').click());
  B('mBgDel',()=>{ const p=S.settings.mapBg?.path; if(p) enqueue('file:'+p,'rmfile'); S.settings.mapBg=null; mapBgURL=null; save(); render(); });
  $('#bgFile',el).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; if(!navigator.onLine) return toast('Uploading a background needs a connection');
    const blob=await compressImage(f,2400,0.85); const bmp=await createImageBitmap(blob); const path=`${UID}/mapbg-${Date.now()}.jpg`;
    const {error}=await sb.storage.from('photos').upload(path, blob, {contentType:'image/jpeg', upsert:true}); if(error) return toast('Upload failed: '+error.message);
    const old=S.settings.mapBg?.path; if(old) enqueue('file:'+old,'rmfile');
    S.settings.mapBg={path, w:bmp.width, h:bmp.height}; S.settings.mapH=Math.round(S.settings.mapW*bmp.height/bmp.width); save(); MAP.vb=null; mapBgURL=URL.createObjectURL(blob);
    toast('Background set — now calibrate the scale'); render(); };
  const svg=$('#map',el); let down=null;
  svg.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,vb:{...MAP.vb},moved:false,target:e.target}; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove',e=>{ if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; if(!down.moved && Math.hypot(dx,dy)<8) return; down.moved=true;
    const r=svg.getBoundingClientRect(); const k=Math.max(MAP.vb.w/r.width, MAP.vb.h/r.height); MAP.vb.x=down.vb.x-dx*k; MAP.vb.y=down.vb.y-dy*k; drawMap(); });
  svg.addEventListener('pointerup',e=>{ if(!down) return; const d=down; down=null; if(d.moved) return; const pt=svgPoint(svg,e);
    if(MAP.mode==='draw'){ MAP.pts.push([pt.x,pt.y]); drawMap(); const h=$('.maphelp'); if(h) h.innerHTML=`Tap the map to add corner points (${MAP.pts.length} so far). Drag to pan. Press <b>Finish</b> when done (min 3 points).`; }

/* ---------- farm location / Eircode ---------- */
function locSourceText(s){ return ({osm:'Eircode found (exact address point)', routing:`approximate — centre of Eircode area ${s.eircode?s.eircode.slice(0,3):''}, can be 5–30 km out`, gps:'from your phone’s GPS', pin:'pin dropped on the map', coords:'coordinates entered'})[s.locSource]||''; }
function normEircode(v){ const m=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').match(/^([AC-FHKNPRTV-Y]\d{2}|D6W)([0-9AC-FHKNPRTV-Y]{4})$/); return m?`${m[1]} ${m[2]}`:null; }

  const key=code.slice(0,3), flat=code.replace(/\s/g,'');

      if(r.ok){ const j=await r.json(); const hit=(j||[]).find(x=>String(x.name||'').toUpperCase().replace(/\s/g,'')===flat); if(hit) return {lat:+hit.lat, lon:+hit.lon, source:'osm', label:hit.display_name}; } }catch(e){ console.warn('Nominatim',e); } }
  const rk=ROUTING_KEYS[key]; if(rk) return {lat:rk[1], lon:rk[2], source:'routing', label:`${key} area (${rk[0]})`};
  return null; }
function parseLatLon(t){ t=String(t||'').trim(); let m=t.match(/(?:daddr|q|ll|query|destination)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i)||t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/^(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)$/);
  if(!m) return null; const lat=+m[1], lon=+m[2]; if(!(lat>51&&lat<55.6&&lon>-11&&lon<-5.3)) return {err:'Those coordinates are not in Ireland (expected latitude 51–55.5, longitude −11 to −5.5).'}; return {lat,lon}; }
function setFarmLocation(lat,lon,{source,eircode,quiet}={}){ const s=S.settings; Object.assign(s,{lat:+(+lat).toFixed(6), lon:+(+lon).toFixed(6), locSource:source, locSetAt:nowISO()}); if(eircode!==undefined) s.eircode=eircode;
  s.locName=''; s.locCounty=''; s.locNameFor='';
  save(); MAP.center=[s.lat,s.lon]; MAP.zoom=source==='routing'?12:17; if(!quiet) toast('Farm location saved — map and weather now use it'); wxLocationChanged(); if($('#dlg').open) $('#dlg').close(); render(); }
function gpsLocate(save){ if(!navigator.geolocation) return toast('Location not available on this device');

    if(save) setFarmLocation(la,lo,{source:'gps'}); else { MAP.center=[la,lo]; MAP.zoom=18; if(LMAP){ LMAP.setView([la,lo],18); L.circle([la,lo],{radius:Math.max(accuracy,5),color:'#1e6fd0',weight:2,fillOpacity:.15}).addTo(LMAP); } toast(`You are here (±${Math.round(accuracy)} m)`); } },
    e=>toast('Location error: '+e.message),{enableHighAccuracy:true,timeout:15000}); }
function locationDialog(){ const s=S.settings; const dlg=$('#dlg');

/* ---------- KML / KMZ (Google Earth) ---------- */
function loadScript(src){ return new Promise((ok,bad)=>{ if(document.querySelector(`script[src="${src}"]`)&&window.JSZip) return ok(); const t=document.createElement('script'); t.src=src; t.onload=ok; t.onerror=()=>bad(new Error('Could not load '+src)); document.head.appendChild(t); }); }
async function kmlTextFromFile(file){ const head=new Uint8Array(await file.slice(0,2).arrayBuffer());
  if(head[0]===0x50&&head[1]===0x4b){ await loadScript('vendor/jszip.min.js'); const zip=await JSZip.loadAsync(file); const ks=zip.file(/\.kml$/i).sort((a,b)=>(a.name.toLowerCase().endsWith('doc.kml')?-1:0)-(b.name.toLowerCase().endsWith('doc.kml')?-1:0)); if(!ks.length) throw new Error('No .kml file inside this KMZ'); return ks[0].async('string'); }
  return file.text(); }
function cleanRing(r){ const o=[]; r.forEach(q=>{ const l=o[o.length-1]; if(!l||l[0]!==q[0]||l[1]!==q[1]) o.push(q); }); if(o.length>1){ const a=o[0], b=o[o.length-1]; if(Math.abs(a[0]-b[0])<1e-9&&Math.abs(a[1]-b[1])<1e-9) o.pop(); } return o; }
function parseKml(text){ const doc=new DOMParser().parseFromString(text,'application/xml'); if(doc.getElementsByTagName('parsererror').length) throw new Error('This is not a valid KML file');
  const T=(el,n)=>[...el.getElementsByTagNameNS('*',n)]; const kid=(el,n)=>[...el.children].find(c=>c.localName===n);
  const coords=t=>String(t||'').trim().split(/\s+/).map(x=>x.split(',').map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])&&Math.abs(a[1])<=90).map(a=>[a[1],a[0]]);
  const out=[]; T(doc,'Placemark').forEach((pm,i)=>{ const name=(kid(pm,'name')?.textContent||'').trim()||`Field ${out.length+1}`; const polys=T(pm,'Polygon');
    polys.forEach((pg,j)=>{ const ob=T(pg,'outerBoundaryIs')[0]; const c=ob?T(ob,'coordinates')[0]:T(pg,'coordinates')[0]; const ring=cleanRing(coords(c?.textContent)); const holes=T(pg,'innerBoundaryIs').length;
      if(ring.length>=3) out.push({name:polys.length>1?`${name} (${j+1})`:name, geo:ring, kind:'polygon', holes}); });
    if(!polys.length) T(pm,'LineString').concat(T(pm,'LinearRing')).forEach(ls=>{ const ring=cleanRing(coords(T(ls,'coordinates')[0]?.textContent)); if(ring.length>=3) out.push({name, geo:ring, kind:'line'}); }); });
  return out; }
async function loadKmlFile(file){ try{ const items=parseKml(await kmlTextFromFile(file));
    if(!items.length) return alert('No field shapes (polygons) found in this file. In Google Earth, draw the field as a polygon/shape, then save or export it as KML/KMZ.');
    const byName=new Map(S.paddocks.map(p=>[p.name.trim().toLowerCase(),p]));
    MAP.kml={file:file.name, fit:true, items:items.map((it,i)=>{ const ex=byName.get(it.name.trim().toLowerCase()); return {...it, i, on:it.kind==='polygon', target:ex?ex.id:'new'}; })};
    MAP.view='sat'; MAP.mode='kml'; MAP.center=null; MAP.sel=null; render(); $('#kmlBox')?.scrollIntoView({behavior:'smooth'});
  }catch(e){ console.error(e); alert('Could not read that file: '+e.message); } }
let kmlLayers=null;
function drawKmlPreview(){ if(!LMAP||!MAP.kml) return; if(kmlLayers) kmlLayers.remove(); kmlLayers=L.featureGroup().addTo(LMAP);
  MAP.kml.items.forEach(it=>{ const l=L.polygon(it.geo,{color:it.on?'#ff9500':'#bbbbbb',weight:3,dashArray:'7 5',fillColor:it.on?'#ff9500':'#999',fillOpacity:it.on?.3:.1}).addTo(kmlLayers);
    l.bindTooltip(`<b>${esc(it.name)}</b><br>${num(geoAreaM2(it.geo)/1e4,2)} ha`,{permanent:true,direction:'center',className:'padlbl'});
    l.on('click',e=>{ L.DomEvent.stopPropagation(e); it.on=!it.on; drawKmlPreview(); renderKmlBox(); }); });
  if(MAP.kml.fit && kmlLayers.getLayers().length){ MAP.kml.fit=false; LMAP.fitBounds(kmlLayers.getBounds(),{maxZoom:18,padding:[20,20]}); } }
function renderKmlBox(){ const box=$('#kmlBox'); if(!box||!MAP.kml) return; const K=MAP.kml; const n=K.items.filter(x=>x.on).length;
  box.innerHTML=`<div class="card" style="margin-top:12px;border-color:#ff9500"><h3>Import from ${esc(K.file)}</h3><p class="mut">${K.items.length} shape${K.items.length>1?'s':''} found. Tick the ones to import. A shape whose name matches an existing paddock updates that paddock’s boundary (its records are kept).</p>
   <div class="tw"><table><thead><tr><th></th><th>Name</th><th>Area</th><th>Import as</th></tr></thead><tbody>${K.items.map(it=>`<tr><td><input type="checkbox" data-kon="${it.i}" ${it.on?'checked':''}></td>
     <td><input data-kname="${it.i}" value="${esc(it.name)}" style="min-width:140px">${it.kind==='line'?'<div class="hint warn">path, closed into a field</div>':''}${it.holes?'<div class="hint warn">has holes — outer edge only</div>':''}</td>
     <td style="white-space:nowrap">${num(geoAreaM2(it.geo)/1e4,2)} ha<br><span class="mut">${num(haToAc(geoAreaM2(it.geo)/1e4),2)} ac</span></td>
     <td><select data-ktgt="${it.i}"><option value="new">New paddock</option>${S.paddocks.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${it.target===p.id?'selected':''}>Update “${esc(p.name)}”</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
   <div class="row" style="margin-top:10px"><button class="pri" id="kImport2">⬆ Import ${n} selected</button><button id="kAll">Select all</button><button id="kNone">Select none</button><button id="kCancel">Cancel</button></div></div>`;
  $$('[data-kon]',box).forEach(c=>c.onchange=()=>{ K.items[c.dataset.kon].on=c.checked; drawKmlPreview(); renderKmlBox(); });
  $$('[data-kname]',box).forEach(c=>c.oninput=()=>{ K.items[c.dataset.kname].name=c.value; });

  $('#kImport2',box).onclick=importKmlSelected; $('#kAll',box).onclick=()=>{ K.items.forEach(x=>x.on=true); drawKmlPreview(); renderKmlBox(); }; $('#kNone',box).onclick=()=>{ K.items.forEach(x=>x.on=false); drawKmlPreview(); renderKmlBox(); };
  $('#kCancel',box).onclick=()=>{ MAP.mode='view'; MAP.kml=null; render(); }; }
function importKmlSelected(){ const K=MAP.kml; if(!K) return; const sel=K.items.filter(x=>x.on); if(!sel.length) return toast('Tick at least one shape');
  let nNew=0, nUpd=0; sel.forEach(it=>{ const geo=roundGeo(it.geo); const name=(it.name||'').trim()||'Imported field';
    if(it.target!=='new' && get('paddocks',it.target)){ upd('paddocks',it.target,{geo, importedFrom:K.file}); nUpd++; }
    else { add('paddocks',{name, status:'resting', points:[], geo, importedFrom:K.file},true); nNew++; } });
  save(); MAP.mode='view'; MAP.kml=null; MAP.center=null; toast(`Imported: ${nNew} new paddock${nNew===1?'':'s'}${nUpd?`, ${nUpd} updated`:''}`); render(); }
function exportKml(){ const ps=S.paddocks.filter(hasGeo); if(!ps.length) return toast('No paddocks with a satellite boundary yet');
  const col=c=>{ const h=c.replace('#',''); return h.slice(4,6)+h.slice(2,4)+h.slice(0,2); };
  const x=t=>String(t??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    return `<Placemark><name>${x(p.name)}</name><description>${x(`${num(ha,2)} ha (${num(haToAc(ha),2)} acres) · ${PAD_STATUS[p.status]?.l||p.status||''}${p.landId?' · LPIS '+p.landId:''}`)}</description><styleUrl>#st_${PAD_STATUS[p.status]?p.status:'resting'}</styleUrl>
<ExtendedData><Data name="area_ha"><value>${ha.toFixed(4)}</value></Data><Data name="status"><value>${x(p.status)}</value></Data><Data name="farmapp_id"><value>${x(p.id)}</value></Data></ExtendedData>
<Polygon><tessellate>1</tessellate><outerBoundaryIs><LinearRing><coordinates>${ring.map(q=>`${q[1].toFixed(7)},${q[0].toFixed(7)},0`).join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`; }).join('\n');

async function wipeAccount(keepPaths){ // deletes this user's records + storage objects on the server
  if(!navigator.onLine) throw new Error('Needs an internet connection');
  const paths=new Set(S.photos.map(p=>p.path).filter(Boolean)); if(S.settings.mapBg?.path) paths.add(S.settings.mapBg.path);
  const {data:list}=await sb.storage.from('photos').list(UID,{limit:1000}); (list||[]).forEach(o=>paths.add(`${UID}/${o.name}`));
  const rm=[...paths].filter(p=>!keepPaths.has(p)); for(const c of chunk(rm,100)){ const {error}=await sb.storage.from('photos').remove(c); if(error) throw error; }
  const {error}=await sb.from('records').delete().eq('user_id',UID); if(error) throw error;
  try{ for(const p of (await idbAll('pending')).filter(p=>p.uid===UID && !keepPaths.has(p.path))) await idbDel('pending',p.id); }catch(e){}
  Q={}; saveLocal();
}
async function exportBackup(withPhotos){
  toast('Preparing backup…');
  const out={app:'farm-app', format:2, exportedAt:nowISO(), account:USER?.email||'', data:S, photos:[], mapBg:null};
  if(withPhotos){ for(const p of S.photos){ try{ out.photos.push({...p, dataURL:await blobToDataURL(await photoBlob(p))}); }catch(e){ console.warn('photo skipped',p.id,e); } }
    const bg=S.settings.mapBg; if(bg?.path){ try{ const {data}=await sb.storage.from('photos').download(bg.path); if(data) out.mapBg={w:bg.w,h:bg.h,dataURL:await blobToDataURL(data)}; }catch(e){} } }
  download(`farmhand-backup-${today()}.json`, JSON.stringify(out), 'application/json'); toast('Backup downloaded');
}
async function importBackup(file){
  try{ if(!navigator.onLine) throw new Error('Importing needs an internet connection');
    const j=JSON.parse(await file.text()); const data=normalize(JSON.parse(JSON.stringify(j.data||j))); if(!(j.data||j).settings) throw new Error('Not a Farmhand backup');
    if(!confirm(`Replace all data in your account (${USER.email}) with the backup from ${j.exportedAt?new Date(j.exportedAt).toLocaleString('en-IE',{timeZone:'Europe/Dublin'}):'file'}?`)) return;
    toast('Importing…');
    const withBlob=new Map((Array.isArray(j.photos)?j.photos:[]).filter(p=>p.dataURL).map(p=>[p.id,p]));
    const metas=new Map(data.photos.map(p=>[p.id,p])); withBlob.forEach((p,id)=>{ if(!metas.has(id)){ const {dataURL,blob,...m}=p; metas.set(id,m); } });
    const photos=[], keep=new Set();
    for(const [id,m] of metas){ const path=`${UID}/${id}.jpg`; const src=withBlob.get(id);
      if(src){ const blob=await dataURLToBlob(src.dataURL); const {error}=await sb.storage.from('photos').upload(path, blob, {contentType:'image/jpeg', upsert:true}); if(error) throw error; keep.add(path); photos.push({...m, path, size:blob.size, source:m.source||'manual'}); }
      else if(m.path && m.path.startsWith(UID+'/')){ keep.add(m.path); photos.push(m); } }
    data.photos=photos;
    data.settings.mapBg=(data.settings.mapBg?.path||'').startsWith(UID+'/')?data.settings.mapBg:null; if(data.settings.mapBg) keep.add(data.settings.mapBg.path);
    if(j.mapBg?.dataURL){ const path=`${UID}/mapbg-${Date.now()}.jpg`; const {error}=await sb.storage.from('photos').upload(path, await dataURLToBlob(j.mapBg.dataURL), {contentType:'image/jpeg', upsert:true}); if(error) throw error; data.settings.mapBg={path,w:j.mapBg.w,h:j.mapBg.h}; keep.add(path); }
    await wipeAccount(keep);
    S=data; COLLECTIONS.forEach(c=>S[c].forEach(r=>enqueue(r.id,'up'))); enqueue('__settings','up'); lastSettingsJSON=null; mapBgURL=null; saveLocal();
    await flush(); await loadMapBg(); MAP.vb=null; toast(lastSyncErr?'Imported, but sync problem: '+lastSyncErr:'Backup imported'); render();
  }catch(e){ alert('Import failed: '+e.message); }
}

  if(mode==='recover') body=`${f('aPw','New password (min 8 characters)','password','new-password')}${f('aPw2','Repeat new password','password','new-password')}<button class="pri" type="submit" style="width:100%">Save new password</button>`;
  if(mode==='check') body=`<p style="text-align:center"><a href="#" data-m="login">Back to log in</a></p>`;
