function showAuth(mode='login', msg='', err=''){
  document.body.classList.add('loggedout'); $('#main').innerHTML=''; $('#nav').innerHTML=''; $('#net').textContent=''; $('#farmTitle').textContent='';
  const a=$('#auth'); a.hidden=false; a.innerHTML=authHTML(mode,msg,err);
  $$('[data-m]',a).forEach(x=>x.onclick=e=>{ e.preventDefault(); showAuth(x.dataset.m); });
  const form=$('#authForm',a); const v=id=>($('#'+id,a)?.value||'').trim();
  form.onsubmit=async e=>{ e.preventDefault(); const btn=form.querySelector('button[type=submit]'); if(btn){ btn.disabled=true; btn.textContent='Please wait…'; }
    try{
      if(mode==='login'){ const {data,error}=await sb.auth.signInWithPassword({email:v('aEmail'), password:$('#aPw').value}); if(error) throw error; await onLogin(data.user); }
      else if(mode==='signup'){ const pw=$('#aPw').value; if(!/^\S+@\S+\.\S+$/.test(v('aEmail'))) throw new Error('Enter a valid email address'); if(pw.length<8) throw new Error('Password must be at least 8 characters'); if(pw!==$('#aPw2').value) throw new Error('Passwords do not match');
        const {data,error}=await sb.auth.signUp({email:v('aEmail'), password:pw, options:{emailRedirectTo:APP_URL}}); if(error) throw error;
        if(data.session) await onLogin(data.user);
        else if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0) showAuth('login','','An account with this email already exists — log in instead.');
        else showAuth('check',`Account created. We sent a confirmation link to ${v('aEmail')} — open it on this phone, then log in.`); }
      else if(mode==='forgot'){ const {error}=await sb.auth.resetPasswordForEmail(v('aEmail'),{redirectTo:APP_URL}); if(error) throw error; showAuth('check','If an account exists for that email, a password reset link is on its way.'); }
      else if(mode==='recover'){ const pw=$('#aPw').value; if(pw.length<8) throw new Error('Password must be at least 8 characters'); if(pw!==$('#aPw2').value) throw new Error('Passwords do not match');
        const {data,error}=await sb.auth.updateUser({password:pw}); if(error) throw error; toast('Password updated'); await onLogin(data.user); }
    }catch(err){ showAuth(mode,'',friendlyAuthError(err)); if(mode!=='recover'&&$('#aEmail')) $('#aEmail').value=v('aEmail')||''; }
  };
}
async function onLogin(user){

  document.body.classList.remove('loggedout'); const a=$('#auth'); a.hidden=true; a.innerHTML='';
  parseHash(); render(); await loadPendingBlobs();
  if(await pull() && !$('#dlg').open) render();
  flush(); if(await loadMapBg() && route==='map') render();
}
function clearSession(){ blobURLs.forEach(u=>URL.revokeObjectURL(u)); blobURLs.clear(); signedCache.clear(); S=blankState(); Q={}; UID=null; USER=null; mapBgURL=null; lastSyncAt=0; lastSyncErr=''; MAP.sel=null; MAP.vb=null; MAP.center=null; MAP.zoom=null; MAP.mode='view'; MAP.view='sat'; MAP.kml=null; MAP.pts=[]; }
async function logout(){
  await flush(); const n=Object.keys(Q).length+(await pendingCount());
  if(n && !confirm(`${n} change(s) have not reached the server yet (no connection?) and will be lost from this phone if you log out. Log out anyway?`)) return;
  const uidNow=UID; [kData(),kQueue(),kWx()].forEach(k=>localStorage.removeItem(k));
  try{ for(const p of (await idbAll('pending')).filter(p=>p.uid===uidNow)) await idbDel('pending',p.id); }catch(e){}
  clearSession(); try{ await sb.auth.signOut({scope:'local'}); }catch(e){}
  if($('#dlg').open) $('#dlg').close(); history.replaceState(null,'',location.pathname); showAuth('login','You are logged out.');
}
async function boot(){
  if(!window.supabase){ document.body.innerHTML='<p style="padding:20px">Could not load the app library. Check your connection and reload.</p>'; return; }
  const qs=new URLSearchParams(location.search); const hs=new URLSearchParams(location.hash.slice(1));
  const linkErr=qs.get('error_description')||hs.get('error_description');
  const isRecovery=qs.get('type')==='recovery'||hs.get('type')==='recovery';
  let recovering=false;
  sb=window.supabase.createClient(SB_URL, SB_KEY, {auth:{flowType:'pkce', persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev, session)=>{ setTimeout(()=>{
    if(ev==='PASSWORD_RECOVERY'){ recovering=true; showAuth('recover','Enter a new password for your account.'); }
    else if(ev==='SIGNED_OUT' && UID){ clearSession(); showAuth('login','Your session ended — please log in again.'); }
    else if(ev==='SIGNED_IN' && session && !recovering && session.user.id!==UID) onLogin(session.user);
  },0); });
  let {data:{session}}=await sb.auth.getSession();
  if(qs.has('code')||qs.has('error')||hs.has('access_token')||hs.has('error')) history.replaceState(null,'',location.pathname+(hs.has('access_token')||hs.has('error')?'':location.hash));
  if(linkErr && !session) return showAuth('login','',linkErr.replace(/\+/g,' ')+' — if you already confirmed your email, just log in.');
  if(recovering || isRecovery&&session){ recovering=true; return showAuth('recover','Enter a new password for your account.'); }
  if(!session && !navigator.onLine){ try{ const t=JSON.parse(localStorage.getItem(`sb-${new URL(SB_URL).hostname.split('.')[0]}-auth-token`)); if(t&&t.user){ return onLogin(t.user); } }catch(e){} }
  if(session) await onLogin(session.user);
  else showAuth('login', qs.has('code')?'Email confirmed — you can log in now.':'');
}

/* ---------- init ---------- */
window.addEventListener('hashchange',()=>{ if(!UID) return; parseHash(); render(); window.scrollTo(0,0); });
window.addEventListener('online',()=>{ if(!UID) return; setSync(); fetchWeather(); flush().then(()=>pull()).then(ok=>{ if(ok&&!$('#dlg').open) render(); }); });
window.addEventListener('offline',setSync);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && UID && navigator.onLine) flush().then(()=>pull()).then(ok=>{ if(ok&&!$('#dlg').open) render(); }); });
let rT, lastW=window.innerWidth; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(!UID || $('#dlg').open) return; if(route==='map' && LMAP){ LMAP.invalidateSize(); return; } if(Math.abs(window.innerWidth-lastW)<2) return; lastW=window.innerWidth; render(); },250); });
window.addEventListener('storage',e=>{ if(UID && e.key===kData()){ S=loadCache(); Q=loadQueue(); if(!$('#dlg').open) render(); } });
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW',e));
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
boot();
</script>
